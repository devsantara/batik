name: Bug report
description: Something in Batik does not work the way it is documented
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A minimal reproduction is the single most useful
        thing you can give us — it usually turns a week of back and forth into
        an afternoon.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this has not been reported yet.
          required: true
        - label: I am on the latest version of the affected package.
          required: true

  - type: input
    id: package
    attributes:
      label: Affected package and version
      placeholder: '@devsantara/batik-tokens@0.2.1'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: >-
        A link to a minimal repository or a StackBlitz that shows the bug.
        Issues without one may be closed without investigation.
      placeholder: https://github.com/your-name/batik-bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the package
        2. Render `<Button />`
        3. See the token fall back to the wrong value
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Paste the output of `vp env doctor`, plus your OS, browser and bundler
        if they are relevant.
      render: shell
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Logs, screenshots, or a guess at the cause.
    validations:
      required: false
